<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- <link rel="stylesheet" href="css\global.css" -->
</head>
<body>
   <main>
    <!--section 1 hero-->
    <section id="hero" class="bg-[red] text-center py-[100px]">
    <h1 class="font-zelda text center text-[128px]">my portopolio</h1>
    <p class="px-[100px] text-[32px]">sabrina diajeng suseno</p>
    </section>
    <!--section 2 about me-->
    <section id="about me">
        <h2 class="font-zelda text-center text-[80px]">about me</h2>
        <p class="px-[100px] text-[32px]">aku memiliki kepribadian yang suka berbaur dengan banyak orang dan suka bercanda</p>
    </section>
<!--section 3 my skills-->
    <section id="myskills" class="text-left w-[600px] mx-auto p-[60px]">
        <h2 class="font-zelda text-center text-[80px]">my skills</h2>
        <h3 class="font-zelda text-[48px]">aku suka pelajaran yang berbau dengan alam seperti biologi</h3>
        <div>
            <ul class="text-[32px] list-inside list-disc">
                <li>aku juga suka bahasa inggris</li>
                <li>aku juga suka fisika </li>
            </ul>
        </div>
     </section>
    <!--section 4 my experience-->
    <section id="experience" class="py-[100px]">
        <div class="flex-col gap-4 items-center">
                    <h1 class="font-zelda text-[128px] text-white
                    text-shadow-[0_5px_0_#7A3D21] text-center">
                    my experience               
                 </h1>

                 <div class="flex flex-row gap-4">

                     <img class="w-[600px]" src="images/fotoku/foto1.png" alt="deskripsi foto 1">
                     <img class="w-[600px]" src="images/fotoku/foto2.png" alt="deskripsi foto 2">
                 </div>
                 <div class="flex flex-row gap-4">

                     <img class="w-[600px]" src="images/fotoku/foto3.png" alt="deskripsi foto 3">
                     <img class="w-[600px]" src="images/fotoku/foto4.png" alt="deskripsi foto 4">
                 </div>
        <h2>my experience</h2>
    </section>
   </main> 
</body>
</html>
